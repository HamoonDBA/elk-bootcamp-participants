# Reference pipeline: nginx_access.log -> Elasticsearch index "gateway-access".
# Block 110-175, second part: unstructured text, parsed with Grok.
#
# Connection settings come from environment variables (with local defaults):
#   ACCESS_LOG_PATH  absolute path of nginx_access.log
#   ES_HOSTS         e.g. http://localhost:9200  (Docker Compose: "http://es01:9200 http://es02:9200 http://es03:9200")
#   ES_USER / ES_PASSWORD
#
# Create gateway-access and gateway-access-invalid first (devtools/03_grok.http, Part C).
# Keep this file outside logstash/pipeline/: Logstash joins every .conf file in
# one directory into a single pipeline, and the two pipelines would mix.
#
# One line of the log (the format is defined in nginx.conf):
# 5.65.242.9 - - [03/Nov/2026:00:00:36 +0330] "GET /api/v1/search?city=tehran&q=... HTTP/2.0" 200 4794 "https://search.example.ir/" "Mozilla/5.0 ..." rt=0.245 urt=0.241 rid=req-000002

input {
  file {
    path => "${ACCESS_LOG_PATH:/data/nginx_access.log}"
    mode => "read"
    # On Windows use "NUL" instead of "/dev/null".
    sincedb_path => "/dev/null"
    file_completed_action => "log"
    file_completed_log_path => "${COMPLETED_LOG:/tmp/logstash_completed.log}"
    # No codec: every line arrives as plain text in "message".
  }
}

filter {
  # ^ and $ anchor the pattern to the whole line: a line that only partly
  # matches fails instead of producing half-filled documents, and a failing
  # line is rejected quickly instead of being retried at every position.
  # :int and :float convert the captured text to numbers.
  # "urt" is "-" when Nginx answered by itself (health checks, 404s), so the
  # field is left out instead of being stored as 0.
  grok {
    match => {
      "message" => '^%{IPORHOST:client_ip} - %{NOTSPACE} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{URIPATH:path}(?:\?%{NOTSPACE:params})? HTTP/%{NUMBER:http_version}" %{INT:status:int} %{INT:bytes:int} "%{DATA:referrer}" "%{DATA:user_agent}" rt=%{NUMBER:request_time:float} urt=(?:%{NUMBER:upstream_time:float}|-) rid=(?:-|%{NOTSPACE:request_id})$'
    }
  }

  if "_grokparsefailure" not in [tags] {
    # Health checks from Kubernetes are not user traffic.
    if [path] == "/healthz" {
      drop {}
    }

    # $time_local carries its own offset (+0330), so no timezone option is
    # needed here. Month names are English: set the locale, or the parse
    # fails on a machine with another default language.
    date {
      match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
      locale => "en"
      target => "@timestamp"
    }
    if "_dateparsefailure" not in [tags] {
      mutate { remove_field => ["time_local"] }
    }

    # city=tehran&q=... -> keep only "city".
    kv {
      source => "params"
      field_split => "&"
      include_keys => ["city"]
    }

    # A log line has no natural id. A hash of the whole line gives the same
    # id on every run, so running the pipeline again does not add duplicates.
    fingerprint {
      source => "message"
      target => "[@metadata][fingerprint]"
      method => "SHA256"
    }
    mutate { remove_field => ["message"] }
  }

  mutate { remove_field => ["@version", "event", "log", "host"] }
}

output {
  if "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://localhost:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD:changeme}"
      # ssl_certificate_authorities => ["/path/to/http_ca.crt"]
      index => "gateway-access-invalid"
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOSTS:http://localhost:9200}"]
      user => "${ES_USER:elastic}"
      password => "${ES_PASSWORD:changeme}"
      # ssl_certificate_authorities => ["/path/to/http_ca.crt"]
      index => "gateway-access"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}
